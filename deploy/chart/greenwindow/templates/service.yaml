apiVersion: v1
kind: Service
metadata:
  name: {{ include "greenwindow.fullname" . }}-metrics
  labels:
    {{- include "greenwindow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "greenwindow.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
---
{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "greenwindow.fullname" . }}
  labels:
    {{- include "greenwindow.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "greenwindow.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
