apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "greenwindow.fullname" . }}
  labels:
    {{- include "greenwindow.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "greenwindow.fullname" . }}
  labels:
    {{- include "greenwindow.labels" . | nindent 4 }}
rules:
  - apiGroups: [greenwindow.io]
    resources: [carbonawarejobs]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [greenwindow.io]
    resources: [carbonawarejobs/status]
    verbs: [get, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  - apiGroups: [batch]
    resources: [jobs/status]
    verbs: [get]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create]
  # kopf discovers resources and namespaces when watching the whole cluster.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "greenwindow.fullname" . }}
  labels:
    {{- include "greenwindow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "greenwindow.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "greenwindow.fullname" . }}
    namespace: {{ .Release.Namespace }}
