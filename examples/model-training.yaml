apiVersion: greenwindow.io/v1alpha1
kind: CarbonAwareJob
metadata:
  name: churn-model-training
spec:
  zone: MA
  duration: 3h
  deadline: 24h
  powerWatts: 1500
  # Do not wait if the grid is already this clean.
  maxIntensity: 450
  jobTemplate:
    metadata:
      labels:
        team: data
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: train
              image: python:3.11-slim
              command: ["python", "-c", "print('training...')"]
